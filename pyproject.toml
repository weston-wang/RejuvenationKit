[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rejuvenationkit"
version = "0.1.0"
description = "Engineering-grade analysis primitives for longitudinal rejuvenation studies."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "RejuvenationKit contributors" }]
keywords = ["aging", "longevity", "biomarkers", "bioinformatics", "state-estimation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.16",
  "pandas-stubs>=2.2",
  "pre-commit>=4.2",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
]
docs = [
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=0.29",
]
public-data = [
  "pyreadr>=0.5",
]

[project.urls]
Documentation = "https://github.com/weston-wang/RejuvenationKit#readme"
Issues = "https://github.com/weston-wang/RejuvenationKit/issues"
Source = "https://github.com/weston-wang/RejuvenationKit"

[tool.hatch.build.targets.wheel]
packages = ["src/rejuvenationkit"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=rejuvenationkit --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rejuvenationkit"]
