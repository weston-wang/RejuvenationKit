site_name: RejuvenationKit
site_description: Uncertainty-aware analysis for longitudinal rejuvenation studies
theme:
  name: material
nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data model: data-model.md
  - Phase 1 QC: phase-1-qc.md
  - Multivariate change detection: multivariate-change-detection.md
  - DSP visualization: dsp-visualization.md
  - Sequential response detection: sequential-treatment-response.md
  - Randomized treatment effects: randomized-treatment-effects.md
  - One-command study audit: study-audit.md
  - DAP audit case study: dap-audit-case-study.md
  - Multimodal fusion: multimodal-fusion.md
  - Covariance-aware fusion: covariance-aware-fusion.md
  - Phase 2 architecture and use cases: phase-2-architecture-and-use-cases.md
  - Genome-scale data model: genomic-data-model.md
  - Genomic signatures: genomic-signatures.md
  - Cross-species genomics: cross-species-genomics.md
  - External biology resources: external-biology-resources.md
  - Hugging Face genomics: huggingface-genomics.md
  - Public genomic benchmark: gse131754-genomic-benchmark.md
  - Shared-control concordance reanalysis: gse131754-concordance-reanalysis.md
  - Phase 3 state estimation: phase-3-state.md
  - Phase 4 combination analysis: phase-4-combinations.md
  - Four-phase workflow: four-phase-workflow.md
  - Public-data example: public-data-example.md
  - Canine public-data example: canine-public-data-example.md
  - Canine multimodal example: canine-multimodal-example.md
  - Publishing and citation: publishing.md
  - Roadmap: roadmap.md
plugins:
  - search
  - mkdocstrings
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js
