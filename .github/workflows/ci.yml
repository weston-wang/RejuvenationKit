name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,genomics,hts,visualization]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,docs,visualization]"
      - run: mkdocs build --strict
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/rejuvenationkit-wheel-smoke
          /tmp/rejuvenationkit-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/rejuvenationkit-wheel-smoke/bin/python -m pip check
          /tmp/rejuvenationkit-wheel-smoke/bin/python -c \
            'import rejuvenationkit; import rejuvenationkit.genomics; print(rejuvenationkit.__version__)'

  arrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,arrow]"
      - run: pytest --no-cov tests/test_genomic_chunked.py
